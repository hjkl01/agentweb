services:
  agentweb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: agentweb
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ${HOME:?Set HOME to your host home directory}:/home/agent
      - ${AGENTWEB_RUNTIME_DIR:-$HOME/.local/share/agentweb/runtimes}:/agent-runtimes
    environment:
      - TZ=Asia/Shanghai
      - HOME=/home/agent
      - AGENTWEB_AGENT_HOME=/home/agent
      - XDG_CONFIG_HOME=/home/agent/.config
      - XDG_DATA_HOME=/home/agent/.local/share
      - XDG_CACHE_HOME=/home/agent/.cache
      - DATABASE_URL=sqlite:///home/agent/.config/agentweb/agentweb.db
      - AGENTWEB_WORKSPACE_DIR=/workspaces
      - AGENTWEB_RUNTIME_DIR=/agent-runtimes
      - AGENTWEB_WORKERS=${AGENTWEB_WORKERS:-1}
      - RUST_LOG=${RUST_LOG:-info}
      # npm 安装 Agent 时使用的 registry，子进程会继承该环境变量
      - NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
