services:
  agentweb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # - /home/user/project/:/home/agentweb/project
    environment:
      - HOME=/home/agentweb
      - XDG_CONFIG_HOME=/data/home/.config
      - XDG_DATA_HOME=/data/home/.local/share
      - XDG_CACHE_HOME=/data/home/.cache
      - DATABASE_URL=sqlite:///data/agentweb.db
      - AGENTWEB_WORKSPACE_DIR=/data/workspaces
      - AGENTWEB_RUNTIME_DIR=/data/runtimes/node
      - AGENTWEB_FRONTEND_DIR=/app/frontend
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
