name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: ./scripts/check-names.sh
      - name: Run frontend logic checks
        run: |
          rm -rf .tmp-test
          ./node_modules/.bin/tsc src/lib/format.ts src/lib/sessionFamily.ts src/lib/preferences.ts src/lib/sessionGroups.ts src/lib/pendingMessages.ts src/lib/patch.ts --outDir .tmp-test --module esnext --target esnext --moduleResolution bundler
          node scripts/check-frontend.mjs
          rm -rf .tmp-test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - run: cargo fmt --all -- --check
      - run: cargo check
      - run: cargo test

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t agentweb:ci .
