events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Requests for the same session (including POST messages and its WebSocket)
    # must reach the same worker because live Agent events are process-local.
    map $uri $session_id {
        default "";
        ~^/api/sessions/(?<session_key>[^/]+)(/|$) $session_key;
    }

    upstream agentweb_backend {
        least_conn;
__UPSTREAM_SERVERS__
    }

    upstream agentweb_sessions {
        hash $session_id consistent;
__SESSION_UPSTREAM_SERVERS__
    }

    server {
        listen 8080;

        # Keep session-scoped HTTP and WebSocket requests on the same backend.
        location ~ ^/api/sessions/(?<route_session_id>[^/]+)(/|$) {
            proxy_pass http://agentweb_sessions;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass http://agentweb_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
